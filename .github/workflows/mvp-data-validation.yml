name: MVP data validation

on:
  workflow_dispatch:
  push:
    paths:
      - "data/entities/**"
      - "data/snapshots/**"
      - "eval/reference/**"
      - "database/**"
      - "api/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/mvp-data-validation.yml"
  pull_request:
    paths:
      - "data/entities/**"
      - "data/snapshots/**"
      - "eval/reference/**"
      - "database/**"
      - "api/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/mvp-data-validation.yml"

permissions:
  contents: write

jobs:
  validate-mvp-data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cricko
          POSTGRES_USER: cricko
          POSTGRES_PASSWORD: cricko_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cricko -d cricko"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://cricko:cricko_local_only@localhost:5432/cricko
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: git lfs install

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test and database dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r database/requirements.txt -r api/requirements.txt

      - name: Validate reference implementation
        run: python -m pytest eval/reference database -q

      - name: Ingest pinned IPL snapshot
        run: |
          python -m eval.reference.ingest \
            data/snapshots/cricsheet/ipl_json.zip \
            /tmp/cricko-ipl-2022plus.jsonl

      - name: Ingest pinned men's T20I snapshot
        run: |
          python -m eval.reference.ingest \
            data/snapshots/cricsheet/t20s_male_json.zip \
            /tmp/cricko-t20i-2022plus.jsonl

      - name: Collect player, team, and match metadata
        run: |
          python -m eval.reference.collect_cricsheet_metadata \
            --output-dir data/collected \
            data/snapshots/cricsheet/ipl_json.zip \
            data/snapshots/cricsheet/t20s_male_json.zip

      - name: Report normalized dataset sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [
              Path("/tmp/cricko-ipl-2022plus.jsonl"),
              Path("/tmp/cricko-t20i-2022plus.jsonl"),
          ]:
              lines = sum(1 for _ in path.open(encoding="utf-8"))
              print(f"{path.name}: {lines:,} normalized deliveries")
          PY

      - name: Apply PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Load the pinned snapshot into PostgreSQL
        run: |
          python -m database.load_snapshot \
            --ipl-jsonl /tmp/cricko-ipl-2022plus.jsonl \
            --t20i-jsonl /tmp/cricko-t20i-2022plus.jsonl | tee /tmp/cricko-load-summary.json

      - name: Verify persisted counts and relational integrity
        run: |
          python - <<'PY'
          import json
          import psycopg

          summary = json.load(open("/tmp/cricko-load-summary.json", encoding="utf-8"))
          checks = {
              "matches": summary["matches"],
              "innings": summary["innings"],
              "deliveries": summary["deliveries"],
              "players": summary["players"],
              "teams": summary["teams"],
              "player_match_map": summary["player_match_map"],
          }
          with psycopg.connect(__import__("os").environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  for table, expected in checks.items():
                      cur.execute(f"SELECT COUNT(*) FROM {table}")
                      actual = cur.fetchone()[0]
                      print(f"{table}: expected={expected:,} persisted={actual:,}")
                      assert actual == expected, f"{table} count mismatch"
                  cur.execute("""
                      SELECT COUNT(*) FROM deliveries d
                      JOIN innings i USING (match_id, innings_number)
                      WHERE d.batting_team_id <> i.batting_team_id
                         OR d.bowling_team_id <> i.bowling_team_id
                  """)
                  assert cur.fetchone()[0] == 0, "delivery/innings team mismatch"
                  cur.execute("""
                      SELECT COUNT(*) FROM deliveries
                      WHERE total_runs <> batter_runs + extras_total
                         OR bowler_runs <> total_runs - bye_runs - legbye_runs - penalty_runs
                         OR (wide_runs > 0 AND batter_faced)
                         OR ((wide_runs > 0 OR noball_runs > 0) AND legal_delivery)
                  """)
                  assert cur.fetchone()[0] == 0, "delivery run/legality mismatch"
                  cur.execute("""
                      SELECT COUNT(*) FROM matches m
                      LEFT JOIN teams t1 ON t1.team_id = m.team1_id
                      LEFT JOIN teams t2 ON t2.team_id = m.team2_id
                      WHERE t1.team_id IS NULL OR t2.team_id IS NULL OR m.team1_id = m.team2_id
                  """)
                  assert cur.fetchone()[0] == 0, "invalid match team reference"
          print("PostgreSQL count and integrity checks passed.")
          PY

      - name: Smoke-test FastAPI against loaded PostgreSQL
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 >/tmp/cricko-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/healthz >/tmp/cricko-health.json; then break; fi
            sleep 1
          done
          cat /tmp/cricko-health.json
          curl --silent --show-error --fail "http://127.0.0.1:8000/stats/top-batters?limit=5&min_balls=30" | tee /tmp/cricko-stats.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/cricko-stats.json", encoding="utf-8"))
          assert payload["metric"] == "batting_runs"
          assert payload["count"] > 0
          assert len(payload["results"]) <= 5
          assert all(row["runs"] >= 0 and row["balls_faced"] >= 30 for row in payload["results"])
          print("FastAPI deterministic stats smoke test passed.")
          PY

      - name: Smoke-test bowling, phase, and head-to-head endpoints
        run: |
          curl --silent --show-error --fail "http://127.0.0.1:8000/stats/top-bowlers?limit=5&min_legal_balls=60" | tee /tmp/cricko-bowlers.json
          curl --silent --show-error --fail "http://127.0.0.1:8000/stats/phases?phase=powerplay" | tee /tmp/cricko-phase.json
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          batters = json.load(open("/tmp/cricko-stats.json", encoding="utf-8"))["results"]
          bowlers = json.load(open("/tmp/cricko-bowlers.json", encoding="utf-8"))["results"]
          phase = json.load(open("/tmp/cricko-phase.json", encoding="utf-8"))
          assert batters and bowlers
          assert all(row["legal_balls"] >= 60 for row in bowlers)
          assert all(row["runs_conceded"] >= 0 for row in bowlers)
          assert phase["phase"] == "powerplay"
          assert phase["filters"]["over_start"] == 1 and phase["filters"]["over_end"] == 6
          assert phase["runs"] >= 0 and phase["legal_balls"] >= 0
          params = urllib.parse.urlencode({
              "batter_id": batters[0]["player_id"],
              "bowler_id": bowlers[0]["player_id"],
          })
          with urllib.request.urlopen("http://127.0.0.1:8000/head-to-head?" + params) as response:
              h2h = json.load(response)
          assert h2h["batter_id"] == batters[0]["player_id"]
          assert h2h["bowler_id"] == bowlers[0]["player_id"]
          assert h2h["runs"] >= 0 and h2h["balls_faced"] >= 0
          assert h2h["snapshot_id"] == "cricsheet-mvp-t20-2026-10-08"
          print("Bowling, phase, and head-to-head API smoke tests passed.")
          PY

      - name: Build Next.js interface
        run: |
          npm install
          npm run build

      - name: Commit generated metadata registries
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected/players-source.json data/collected/teams-source.json data/collected/matches-metadata.jsonl
          if git diff --cached --quiet; then
            echo "Collected metadata is unchanged."
          else
            git commit -m "data: refresh Cricsheet player and match registries"
            git push
          fi
