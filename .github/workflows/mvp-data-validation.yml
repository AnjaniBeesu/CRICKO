name: MVP data validation

on:
  workflow_dispatch:
  push:
    paths:
      - "data/entities/**"
      - "data/snapshots/**"
      - "eval/reference/**"
      - "database/**"
      - "api/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/mvp-data-validation.yml"
  pull_request:
    paths:
      - "data/entities/**"
      - "data/snapshots/**"
      - "eval/reference/**"
      - "database/**"
      - "api/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/mvp-data-validation.yml"

permissions:
  contents: write

jobs:
  validate-mvp-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: git lfs install

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test and database dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r database/requirements.txt

      - name: Validate reference implementation
        run: python -m pytest eval/reference database -q

      - name: Ingest pinned IPL snapshot
        run: |
          python -m eval.reference.ingest \
            data/snapshots/cricsheet/ipl_json.zip \
            /tmp/cricko-ipl-2022plus.jsonl

      - name: Ingest pinned men's T20I snapshot
        run: |
          python -m eval.reference.ingest \
            data/snapshots/cricsheet/t20s_male_json.zip \
            /tmp/cricko-t20i-2022plus.jsonl

      - name: Collect player, team, and match metadata
        run: |
          python -m eval.reference.collect_cricsheet_metadata \
            --output-dir data/collected \
            data/snapshots/cricsheet/ipl_json.zip \
            data/snapshots/cricsheet/t20s_male_json.zip

      - name: Report normalized dataset sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [
              Path("/tmp/cricko-ipl-2022plus.jsonl"),
              Path("/tmp/cricko-t20i-2022plus.jsonl"),
          ]:
              lines = sum(1 for _ in path.open(encoding="utf-8"))
              print(f"{path.name}: {lines:,} normalized deliveries")
          PY

      - name: Commit generated metadata registries
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected/players-source.json data/collected/teams-source.json data/collected/matches-metadata.jsonl
          if git diff --cached --quiet; then
            echo "Collected metadata is unchanged."
          else
            git commit -m "data: refresh Cricsheet player and match registries"
            git push
          fi
