name: Pin Cricsheet data

on: [push]

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install Git LFS
        run: git lfs install

      - name: Download official source archives
        run: |
          set -euo pipefail
          mkdir -p data/snapshots/cricsheet
          curl --fail --location --retry 5 --retry-delay 2             https://cricsheet.org/downloads/ipl_json.zip             --output data/snapshots/cricsheet/ipl_json.zip
          curl --fail --location --retry 5 --retry-delay 2             https://cricsheet.org/downloads/t20s_male_json.zip             --output data/snapshots/cricsheet/t20s_male_json.zip

      - name: Validate and pin manifest
        run: python eval/reference/pin_cricsheet_archives.py

      - name: Commit source snapshot
        run: |
          set -euo pipefail
          git config user.name "cricko-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/cricsheet/ipl_json.zip data/snapshots/cricsheet/t20s_male_json.zip data/snapshots/mvp-t20.json
          git commit -m "data: pin Cricsheet MVP T20 source snapshot"
          git push
