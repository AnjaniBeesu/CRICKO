services:
  postgres:
    image: postgres:17
    container_name: cricko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricko
      POSTGRES_USER: cricko
      POSTGRES_PASSWORD: cricko_local_only
    ports:
      - "5432:5432"
    volumes:
      - cricko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricko -d cricko"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cricko_postgres_data:
